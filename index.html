<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客户池转化工具</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 色彩变量 - 浅色模式 */
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: #10b981;
            --secondary-hover: #059669;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --info-color: #6366f1;
            --info-hover: #4f46e5;
            --background-color: #f9fafb;
            --card-background: #ffffff;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --border-radius: 8px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }
        
        /* 深色模式 */
        body.dark-mode {
            --primary-color: #60a5fa;
            --primary-hover: #3b82f6;
            --secondary-color: #34d399;
            --secondary-hover: #10b981;
            --danger-color: #f87171;
            --danger-hover: #ef4444;
            --warning-color: #fbbf24;
            --warning-hover: #f59e0b;
            --info-color: #818cf8;
            --info-hover: #6366f1;
            --background-color: #111827;
            --card-background: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.4);
        }
        
        /* 主题切换按钮 */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            color: var(--text-primary);
        }
        
        .theme-toggle:hover {
            background-color: var(--background-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        /* 基础样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--info-color));
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1rem;
            text-align: center;
            opacity: 0.9;
        }
        
        /* 工具栏样式 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }
        
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* 按钮样式 */
        button {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--card-background);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }
        
        button:hover {
            background-color: var(--background-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        button.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        button.primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        
        button.danger {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }
        
        button.danger:hover {
            background-color: var(--danger-hover);
            border-color: var(--danger-hover);
        }
        
        /* 输入框样式 */
        input, select, textarea {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--card-background);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* 客户卡片样式 */
        .customer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .customer-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
        }
        
        .customer-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        
        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .customer-info h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-primary);
        }
        
        .customer-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        
        .customer-score {
            background-color: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .customer-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        /* 模态框样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }
        
        .modal h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .pagination button {
            padding: 5px 10px;
            font-size: 14px;
        }
        
        .pagination .active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        /* 统计卡片样式 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        
        .stat-card h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            
            .toolbar-left, .toolbar-right {
                justify-content: center;
            }
            
            .customer-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

    <script>
        // 本地存储管理
        const STORAGE_KEY = 'customer-label-data';
        const ENCRYPTION_KEY = 'customer-label-encryption-key';
        const PASSWORD_KEY = 'customer-label-password';
        const BLACKLIST_KEY = 'customer-label-blacklist';
        const WORKFLOW_KEY = 'customer-label-workflows';
        
        // 简单的加密函数
        function encrypt(data) {
            const text = JSON.stringify(data);
            let encrypted = '';
            for (let i = 0; i < text.length; i++) {
                encrypted += String.fromCharCode(text.charCodeAt(i) + 1);
            }
            return btoa(encodeURIComponent(encrypted));
        }
        
        // 简单的解密函数
        function decrypt(encryptedData) {
            const text = decodeURIComponent(atob(encryptedData));
            let decrypted = '';
            for (let i = 0; i < text.length; i++) {
                decrypted += String.fromCharCode(text.charCodeAt(i) - 1);
            }
            return JSON.parse(decrypted);
        }
        
        // 检查是否设置了密码
        function hasPassword() {
            return localStorage.getItem(PASSWORD_KEY) !== null;
        }
        
        // 设置密码
        function setPassword(password) {
            const hashedPassword = btoa(password);
            localStorage.setItem(PASSWORD_KEY, hashedPassword);
        }
        
        // 验证密码
        function verifyPassword(password) {
            const storedPassword = localStorage.getItem(PASSWORD_KEY);
            return btoa(password) === storedPassword;
        }
        
        // 加载数据
        function loadData() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    return decrypt(savedData);
                } catch (error) {
                    console.error('解密数据失败:', error);
                    return null;
                }
            }
            return null;
        }
        
        // 保存数据
        function saveData(data) {
            try {
                const encryptedData = encrypt(data);
                localStorage.setItem(STORAGE_KEY, encryptedData);
            } catch (error) {
                console.error('加密数据失败:', error);
            }
        }
        
        // 加载黑名单数据
        function loadBlacklist() {
            const savedBlacklist = localStorage.getItem(BLACKLIST_KEY);
            if (savedBlacklist) {
                try {
                    return decrypt(savedBlacklist);
                } catch (error) {
                    console.error('解密黑名单数据失败:', error);
                    return [];
                }
            }
            return [];
        }
        
        // 保存黑名单数据
        function saveBlacklist(blacklist) {
            try {
                const encryptedBlacklist = encrypt(blacklist);
                localStorage.setItem(BLACKLIST_KEY, encryptedBlacklist);
            } catch (error) {
                console.error('加密黑名单数据失败:', error);
            }
        }
        
        // 加载工作流数据
        function loadWorkflows() {
            const savedWorkflows = localStorage.getItem(WORKFLOW_KEY);
            if (savedWorkflows) {
                try {
                    return decrypt(savedWorkflows);
                } catch (error) {
                    console.error('解密工作流数据失败:', error);
                    return [];
                }
            }
            return [];
        }
        
        // 保存工作流数据
        function saveWorkflows(workflows) {
            try {
                const encryptedWorkflows = encrypt(workflows);
                localStorage.setItem(WORKFLOW_KEY, encryptedWorkflows);
            } catch (error) {
                console.error('加密工作流数据失败:', error);
            }
        }
        
        // 初始化应用数据

            publicPool: [],
            blacklist: [],
            workflows: []
        };

        // 更新客户UI
        function updateCustomerUI() {
            const customerGrid = document.getElementById('customer-grid');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            
            // 过滤客户
            let filteredCustomers = appData.customers;
            if (searchTerm) {
                filteredCustomers = filteredCustomers.filter(customer => 
                    customer.name.toLowerCase().includes(searchTerm) ||
                    customer.company.toLowerCase().includes(searchTerm) ||
                    customer.phone.includes(searchTerm) ||
                    customer.wechat.toLowerCase().includes(searchTerm)
                );
            }
            if (statusFilter !== 'all') {
                filteredCustomers = filteredCustomers.filter(customer => customer.status === statusFilter);
            }
            
            // 分页设置
            const pageSize = 6;
            const currentPage = 1;
            const totalPages = Math.ceil(filteredCustomers.length / pageSize);
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const paginatedCustomers = filteredCustomers.slice(startIndex, endIndex);
            
            // 生成客户卡片
            customerGrid.innerHTML = '';
            paginatedCustomers.forEach(customer => {
                const card = document.createElement('div');
                card.className = 'customer-card';
                card.setAttribute('data-id', customer.id);
                
                const statusText = {
                    'lead': '线索',
                    'following': '跟进中',
                    'high-intent': '高意向',
                    'closed': '已成交',
                    'lost': '已流失'
                };
                
                card.innerHTML = `
                    <div class="customer-header">
                        <div class="customer-info">
                            <h3>${customer.name}</h3>
                            <p>公司: ${customer.company || '未知'}</p>
                            <p>来源: ${customer.source || '未知'}</p>
                            <p>状态: ${statusText[customer.status]}</p>
                        </div>
                        <div class="customer-score">${customer.ai_score}</div>
                    </div>
                    <div class="customer-actions">
                        <button onclick="viewCustomer('${customer.id}')">查看</button>
                        <button onclick="advanceCustomer('${customer.id}')">推进</button>
                        <button onclick="editCustomer('${customer.id}')">修改</button>
                        <button onclick="discardCustomer('${customer.id}')">废弃</button>
                    </div>
                `;
                
                customerGrid.appendChild(card);
            });
            
            // 生成分页按钮
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages > 1) {
                // 上一页按钮
                const prevButton = document.createElement('button');
                prevButton.textContent = '上一页';
                prevButton.onclick = () => changePage(currentPage - 1);
                prevButton.disabled = currentPage === 1;
                pagination.appendChild(prevButton);
                
                // 页码按钮
                for (let i = 1; i <= totalPages; i++) {
                    const pageButton = document.createElement('button');
                    pageButton.textContent = i;
                    pageButton.className = i === currentPage ? 'active' : '';
                    pageButton.onclick = () => changePage(i);
                    pagination.appendChild(pageButton);
                }
                
                // 下一页按钮
                const nextButton = document.createElement('button');
                nextButton.textContent = '下一页';
                nextButton.onclick = () => changePage(currentPage + 1);
                nextButton.disabled = currentPage === totalPages;
                pagination.appendChild(nextButton);
            }
        }

            const totalCustomers = appData.customers.length;
            const highIntentCustomers = appData.customers.filter(c => c.status === 'high-intent').length;
            const closedCustomers = appData.customers.filter(c => c.status === 'closed').length;
            const averageScore = totalCustomers > 0 ? Math.round(appData.customers.reduce((sum, c) => sum + c.ai_score, 0) / totalCustomers) : 0;
            
            document.getElementById('total-customers').textContent = totalCustomers;
            document.getElementById('high-intent-customers').textContent = highIntentCustomers;
            document.getElementById('closed-customers').textContent = closedCustomers;

        // 推进客户状态
        function advanceCustomer(customerId) {
            // 确保customerId是字符串类型，避免数字精度问题
            const customerIdStr = String(customerId);
            const customer = appData.customers.find(c => c.id === customerIdStr);
            if (!customer) return;
            
            const statusOrder = ['lead', 'following', 'high-intent', 'closed'];
            const currentIndex = statusOrder.indexOf(customer.status);
            
            if (currentIndex < statusOrder.length - 1) {
                customer.status = statusOrder[currentIndex + 1];
                customer.updated_at = new Date().toISOString();
                saveData(appData);
                updateCustomerUI();
                updateStatistics();
                alert('客户状态已更新！');
            } else {
                alert('客户已达到最高状态！');
            }
        }

        // 更新黑名单UI
        function updateBlacklistUI() {
            const blacklistList = document.getElementById('blacklist-list');
            blacklistList.innerHTML = '';
            
            if (appData.blacklist.length === 0) {
                blacklistList.innerHTML = '<p>黑名单为空</p>';
                return;
            }
            
            appData.blacklist.forEach(item => {
                const itemElement = document.createElement('div');
                itemElement.style.display = 'flex';
                itemElement.style.justifyContent = 'space-between';
                itemElement.style.alignItems = 'center';
                itemElement.style.padding = '5px 0';
                itemElement.style.borderBottom = '1px solid var(--border-color)';
                itemElement.innerHTML = `
                    <div>
                        <strong>${item.phone}</strong> - ${item.reason}
                    </div>
                    <button onclick="removeBlacklist('${item.phone}')" style="padding: 2px 6px; font-size: 12px;">删除</button>
                `;
                blacklistList.appendChild(itemElement);
            });
        }
        
        // 添加到黑名单
        function addBlacklist() {
            const phone = document.getElementById('blacklist-phone').value;
            const reason = document.getElementById('blacklist-reason').value;
            
            if (!phone) {
                alert('请输入手机号');
                return;
            }
            
            // 检查是否已经在黑名单中
            if (appData.blacklist.some(item => item.phone === phone)) {
                alert('该手机号已经在黑名单中');
                return;
            }
            
            appData.blacklist.push({
                phone: phone,
                reason: reason,
                added_at: new Date().toISOString()
            });
            
            saveBlacklist(appData.blacklist);
            updateBlacklistUI();
            
            // 清空表单
            document.getElementById('blacklist-phone').value = '';
            document.getElementById('blacklist-reason').value = '';
            
            alert('已添加到黑名单');
        }
        
        // 从黑名单中移除
        function removeBlacklist(phone) {
            if (confirm('确定要从黑名单中移除吗？')) {
                appData.blacklist = appData.blacklist.filter(item => item.phone !== phone);
                saveBlacklist(appData.blacklist);
                updateBlacklistUI();
                alert('已从黑名单中移除');
            }
        }
        
        // 导出数据
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'customer-data.json';
            link.click();
            URL.revokeObjectURL(url);
        }
        
        // 切换主题
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            
            if (document.body.classList.contains('dark-mode')) {
                themeIcon.textContent = '☀️';
                themeText.textContent = '浅色模式';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = '深色模式';
                localStorage.setItem('theme', 'light');
            }
        }
        
        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                const themeIcon = document.getElementById('theme-icon');
                const themeText = document.getElementById('theme-text');
                if (themeIcon && themeText) {
                    themeIcon.textContent = '☀️';
                    themeText.textContent = '浅色模式';
                }
            }
        }

                    openAddCustomerModal();
                }
            });
